name: Generar APK del modelo binario

on:
  push:
    branches:
      - "arbol-5.1(MODELO-BINARIO)"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbol-5-1-modelo-binario-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Probar, compilar y publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # El repositorio conserva gradle-wrapper.properties, pero no los
      # ejecutables ni gradle-wrapper.jar. Se regeneran en el runner antes de
      # que Flutter intente invocarlos.
      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Descargar dependencias
        run: flutter pub get

      - name: Recuperar Gradle Wrapper
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' \
            "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
          cd android
          gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Ejecutar pruebas Dart
        run: flutter test

      - name: Ejecutar pruebas Kotlin del detector binario
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Preparar credenciales del backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_PUBLISHABLE_KEY":"%s"}\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > env.json
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::La APK se generara, pero sin ambos secretos no podra conectarse al backend."
          fi

      - name: Compilar APK solo para probar el detector
        run: |
          flutter build apk --release --dart-define=DETECTOR_TEST_MODE=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Sistema-Inteligente-Ventas-solo-detector.apk

      - name: Compilar APK de release
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Compilar APK de depuracion
        run: flutter build apk --debug --dart-define-from-file=env.json

      - name: Preparar descargas
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Sistema-Inteligente-Ventas-modelo-binario.apk
          cp build/app/outputs/flutter-apk/app-debug.apk \
            dist/Sistema-Inteligente-Ventas-modelo-binario-debug.apk
          cat > dist/notas-release.md <<'NOTAS'
          APK de la rama `arbol-5.1(MODELO-BINARIO)`.

          - `Sistema-Inteligente-Ventas-modelo-binario.apk`: versión normal
            para instalar, usar y demostrar.
          - `Sistema-Inteligente-Ventas-modelo-binario-debug.apk`: versión de
            diagnóstico para consultar registros con `adb logcat`.
          - `Sistema-Inteligente-Ventas-solo-detector.apk`: abre directamente
            la cámara y prueba el detector sin Supabase ni conexión a internet.

          Las tres contienen el mismo detector facial binario. No se deben
          instalar simultáneamente porque comparten el mismo identificador.
          NOTAS

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: apk-modelo-binario-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Crear o actualizar descarga permanente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view arbol-5-1-modelo-binario-latest >/dev/null 2>&1; then
            gh release create arbol-5-1-modelo-binario-latest \
              --target "arbol-5.1(MODELO-BINARIO)" \
              --title "APK automática — modelo binario" \
              --notes "APK generada automáticamente desde la rama del detector binario." \
              --prerelease
          fi

          gh release upload arbol-5-1-modelo-binario-latest \
            dist/Sistema-Inteligente-Ventas-modelo-binario.apk \
            dist/Sistema-Inteligente-Ventas-modelo-binario-debug.apk \
            dist/Sistema-Inteligente-Ventas-solo-detector.apk \
            --clobber

          gh release edit arbol-5-1-modelo-binario-latest \
            --title "APK automática — modelo binario" \
            --notes-file dist/notas-release.md
