name: Generar APK de steven1.1

on:
  push:
    branches:
      - steven1.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steven1-1-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Probar, compilar y publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      # La de release es la que se instala para usar y demostrar: Dart va
      # compilado (AOT) y responde bastante mas rapido que la de depuracion.
      # R8 queda desactivado a proposito (ver android/app/build.gradle.kts):
      # eliminaba los ComponentRegistrar que ML Kit busca por reflexion.
      - name: Compilar APK de release
        run: flutter build apk --release

      # La de depuracion se publica solo como herramienta: es la unica que
      # deja leer la base del celular con `adb run-as`, que es como funciona
      # tools/ver_base.py. En release Android bloquea ese acceso.
      - name: Compilar APK de depuracion
        run: flutter build apk --debug

      - name: Preparar archivos de descarga
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Sistema-Inteligente-Ventas-steven1.1.apk
          cp build/app/outputs/flutter-apk/app-debug.apk \
            dist/Sistema-Inteligente-Ventas-steven1.1-debug.apk

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: apk-steven1-1-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Crear o actualizar la descarga permanente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view steven1-1-latest >/dev/null 2>&1; then
            gh release create steven1-1-latest \
              --target steven1.1 \
              --title "APK automática de steven1.1" \
              --notes "APK instalable generada automáticamente desde la rama steven1.1." \
              --prerelease
          fi

          gh release upload steven1-1-latest \
            dist/Sistema-Inteligente-Ventas-steven1.1.apk \
            dist/Sistema-Inteligente-Ventas-steven1.1-debug.apk \
            --clobber

          gh release edit steven1-1-latest \
            --title "APK automática de steven1.1" \
            --notes "Última compilación correcta de steven1.1: $GITHUB_SHA

Cuál descargar:
- Sistema-Inteligente-Ventas-steven1.1.apk — release. La normal: instalar, usar y demostrar.
- Sistema-Inteligente-Ventas-steven1.1-debug.apk — solo si hace falta leer la base
  del celular con 'python tools/ver_base.py' (adb run-as no funciona en release).

No instales las dos: la segunda reemplaza a la primera."
