name: Generar APK de nuevo-modelo

on:
  push:
    branches:
      - nuevo-modelo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuevo-modelo-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Probar, compilar y publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK instalable
        run: flutter build apk --release

      - name: Preparar archivo de descarga
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Sistema-Inteligente-Ventas-nuevo-modelo.apk

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: apk-nuevo-modelo-${{ github.run_number }}
          path: dist/Sistema-Inteligente-Ventas-nuevo-modelo.apk
          retention-days: 14
          if-no-files-found: error

      - name: Crear o actualizar la descarga permanente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view nuevo-modelo-latest >/dev/null 2>&1; then
            gh release create nuevo-modelo-latest \
              --target nuevo-modelo \
              --title "APK automática de nuevo-modelo" \
              --notes "APK instalable generada automáticamente desde la rama nuevo-modelo." \
              --prerelease
          fi

          gh release upload nuevo-modelo-latest \
            dist/Sistema-Inteligente-Ventas-nuevo-modelo.apk \
            --clobber

          gh release edit nuevo-modelo-latest \
            --title "APK automática de nuevo-modelo" \
            --notes "Última compilación correcta de nuevo-modelo: $GITHUB_SHA"
